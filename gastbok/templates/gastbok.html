<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gästbok</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <main>
    <h1>Gästbok</h1>
    <p class="intro">Skriv något</p>

    <form method="post" action="{{ url_for('skicka') }}" class="gastbok-form">
      <div class="form-group">
        <label for="namn">Namn</label>
        <input type="text" id="namn" name="namn" required maxlength="60">
      </div>

      <div class="form-group">
        <label for="meddelande">Meddelande</label>
        <textarea id="meddelande" name="meddelande" rows="4" required maxlength="500"></textarea>
      </div>

      <button type="submit">Skicka</button>
    </form>

    <h2>Inlägg ({{ posts|length }})</h2>

    {% if posts %}
      <ul class="inlagg-lista">
        {% for post in posts %}
          <li class="inlagg">
            <div class="inlagg__header">
              <span class="inlagg__namn">{{ post.namn }}</span>
              <span class="inlagg__tid">{{ post.tid }}</span>
            </div>
            <p class="inlagg__text">{{ post.meddelande }}</p>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p class="tom">Inga inlägg ännu</p>
    {% endif %}
  </main>

</body>
</html>
